[package]
name = "asun"
version = "1.2.0"
authors = ["Athan Xiao <athanxiao@gmail.com>"]
edition = "2024"
description = "ASUN (Array-Schema Unified Notation) - A high-performance, token-efficient serde data format with schema-data separation"
license = "MIT"
repository = "https://github.com/asunLab/asun-rs"
readme = "README.md"
documentation = "https://docs.rs/asun"
homepage = "https://github.com/asunLab/asun-rs"
keywords = ["asun", "serialization", "serde", "token-efficient", "schema"]
categories = ["encoding", "parser-implementations"]
rust-version = "1.95"

[dependencies]
asun-derive = { path = "derive", version = "1.2.0" }
ryu = "1"
fast-float2 = "0.2"
itoap = "1"

[dev-dependencies]
# serde/serde_json are used ONLY by examples, benches and integration tests to
# benchmark ASUN against JSON. The library crate itself has zero serde deps.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "complex"
path = "examples/complex.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"

[[example]]
name = "cross_compat"
path = "examples/cross_compat.rs"

[[example]]
name = "profile_target"
path = "examples/profile_target.rs"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[profile.release]
debug = false

